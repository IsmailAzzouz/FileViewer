<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">FileViewer — Precise by Construction</title>
  <desc id="description">A restrained white FileViewer monogram and wordmark on black, with a node spine beside the F, the motto Precise by Construction, and supported format tags.</desc>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6d6d6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="#050505"/>

  <!-- Four open corners frame the work without enclosing it. -->
  <g fill="none" stroke="#6d6d6d" stroke-width="1.5">
    <path d="M 521 93 V 67 H 547"/>
    <path d="M 653 67 H 679 V 93"/>
    <path d="M 521 151 V 177 H 547"/>
    <path d="M 653 177 H 679 V 151"/>
  </g>

  <!-- The F is cut from three deliberate strokes. -->
  <g fill="url(#mark)">
    <path d="M 549 86 H 562 V 158 H 549 Z"/>
    <path d="M 562 86 H 615 L 605 99 H 562 Z"/>
    <path d="M 562 116 H 600 L 590 129 H 562 Z"/>
  </g>

  <!-- The spine beside it: the tree view, three levels deep. -->
  <g stroke="#8a8a8a" stroke-width="1.5" fill="none">
    <path d="M 635 100 V 144"/>
    <path d="M 635 100 H 643"/>
    <path d="M 635 122 H 643"/>
    <path d="M 635 144 H 643"/>
  </g>
  <g fill="#8a8a8a">
    <circle cx="649" cy="100" r="3.5"/>
    <circle cx="649" cy="122" r="3.5"/>
    <circle cx="649" cy="144" r="3.5"/>
  </g>

  <text x="600" y="272" text-anchor="middle" fill="#f4f4f4"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="66" font-weight="400"
        letter-spacing="14">FILEVIEWER</text>
  <text x="600" y="312" text-anchor="middle" fill="#9e9ea8"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500"
        letter-spacing="8">PRECISE BY CONSTRUCTION</text>

  <!-- Supported format pills -->
  <g font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace"
     font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle" dominant-baseline="central">
    <!-- JSON -->
    <rect x="366" y="346" width="84" height="28" rx="6" fill="#141417" stroke="#32323a" stroke-width="1.2"/>
    <text x="408" y="360" fill="#e4e4e7">JSON</text>

    <!-- JSONC -->
    <rect x="462" y="346" width="84" height="28" rx="6" fill="#141417" stroke="#32323a" stroke-width="1.2"/>
    <text x="504" y="360" fill="#e4e4e7">JSONC</text>

    <!-- JSONL -->
    <rect x="558" y="346" width="84" height="28" rx="6" fill="#141417" stroke="#32323a" stroke-width="1.2"/>
    <text x="600" y="360" fill="#e4e4e7">JSONL</text>

    <!-- TOML -->
    <rect x="654" y="346" width="84" height="28" rx="6" fill="#141417" stroke="#32323a" stroke-width="1.2"/>
    <text x="696" y="360" fill="#e4e4e7">TOML</text>

    <!-- YAML -->
    <rect x="750" y="346" width="84" height="28" rx="6" fill="#141417" stroke="#32323a" stroke-width="1.2"/>
    <text x="792" y="360" fill="#e4e4e7">YAML</text>
  </g>
</svg>
